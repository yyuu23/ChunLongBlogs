<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d299c2"/>
      <stop offset="100%" stop-color="#fef9d7"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
    <radialGradient id="g0">
      <stop offset="0%" stop-color="#a1c4fd"/>
      <stop offset="100%" stop-color="#a1c4fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#base)"/>
  <circle cx="300" cy="200" r="210" fill="url(#g0)" filter="url(#blur)" opacity="0.85"/>
</svg>
