# ChunLong Blog 基础安全响应头（被 chunlongblog.cn.conf 以 include 复用）
#
# 部署：cp security-headers.conf /etc/nginx/snippets/chunlong-security-headers.conf
#
# 为什么放 nginx 而不放 next.config headers()：生产里 /_next/static、
# /uploads 等静态由 nginx 直发磁盘不经 Node，next 的 headers 对其无效——
# 而 nosniff 恰恰对上传文件最有价值；always 标志还能覆盖 nginx 自产的
# 502/504 错误页（certbot 前纯 HTTP 阶段尤其重要）。
#
# add_header 继承陷阱：nginx 的 add_header 不跨层叠加——location 里一旦
# 写了自己的 add_header（如缓存头），server 级的会被整体覆盖。所以
# server 块与每个含 add_header 的 location 都要 include 本文件。
#
# 刻意后置（不在此文件加）：
# - Strict-Transport-Security：纯 HTTP 下发 HSTS 无效且不可撤回，
#   待 certbot 签证书、HTTPS 强制跳转后再加
# - Content-Security-Policy：站点有首帧内联脚本/JSON-LD/pixi 资源，
#   需要 nonce 方案支撑，单独立项
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
