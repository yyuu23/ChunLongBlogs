<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0c3fc"/>
      <stop offset="100%" stop-color="#8ec5fc"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
    <radialGradient id="g0">
      <stop offset="0%" stop-color="#7f7fd5"/>
      <stop offset="100%" stop-color="#7f7fd5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1">
      <stop offset="0%" stop-color="#c1dfc4"/>
      <stop offset="100%" stop-color="#c1dfc4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <circle cx="1600" cy="300" r="500" fill="url(#g0)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="300" cy="900" r="460" fill="url(#g1)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="900" cy="500" r="380" fill="url(#g2)" filter="url(#blur)" opacity="0.6"/>
</svg>
