<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a1c4fd"/>
      <stop offset="100%" stop-color="#c2e9fb"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
    <radialGradient id="g0">
      <stop offset="0%" stop-color="#84fab0"/>
      <stop offset="100%" stop-color="#84fab0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1">
      <stop offset="0%" stop-color="#8fd3f4"/>
      <stop offset="100%" stop-color="#8fd3f4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2">
      <stop offset="0%" stop-color="#e0c3fc"/>
      <stop offset="100%" stop-color="#e0c3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <circle cx="200" cy="400" r="460" fill="url(#g0)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="1700" cy="700" r="520" fill="url(#g1)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="900" cy="1000" r="400" fill="url(#g2)" filter="url(#blur)" opacity="0.6"/>
</svg>
