  </defs>
  <rect width="1200" height="630" fill="url(#base)"/>
  <circle cx="300" cy="160" r="300" fill="url(#g0)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="950" cy="480" r="320" fill="url(#g1)" filter="url(#blur)" opacity="0.85"/>
  <text x="60" y="560" font-family="'Segoe UI', 'Noto Sans SC', sans-serif" font-size="64" font-weight="800" fill="rgba(255,255,255,.85)">Next.js</text>
