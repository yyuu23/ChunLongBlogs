# ChunLong Blog 生产 nginx 配置（域名 chunlongblog.cn）
#
# 状态：ICP 备案已于 2026-09 通过（备案域名 chunlongblog.cn），本文件为
# 备案后的标准配置：listen 80，443 由 certbot 自动补充。
# 历史：备案期间曾以 8080 端口 + http://<服务器IP>:8080 访问——阿里云按
# Host 头拦截未备案域名（403 "Non-compliance ICP Filing"，Server: Beaver），
# 拦截与端口无关。原域名 chunlongblog.top 未列入本次备案，已弃用。
#
# 首次切换到域名的操作顺序：
#   0. DNS：chunlongblog.cn / www.chunlongblog.cn 的 A 记录指向服务器 IP；
#      建议先设 DNS only（灰云），保证 certbot HTTP-01 验证直连可达
#   1. 阿里云安全组放行 80/443 入方向（备案期只开了 8080）
#   2. 部署本配置：
#      cp chunlongblog.cn.conf /etc/nginx/sites-available/
#      ln -sf /etc/nginx/sites-available/chunlongblog.cn.conf /etc/nginx/sites-enabled/
#      rm -f /etc/nginx/sites-enabled/default
#      mkdir -p /var/cache/nginx/img /var/cache/nginx/html   # proxy_cache 目录需手动创建
#      nginx -t && systemctl reload nginx
#      验证 http://chunlongblog.cn 返回 200。备案数据同步到阿里云拦截系统
#      有几分钟到几小时的延迟，仍 403 就等同步完成再继续下一步
#   3. apt install -y certbot python3-certbot-nginx
#      certbot --nginx -d chunlongblog.cn -d www.chunlongblog.cn
#      （certbot 会自动补 443 server 块、证书配置与 80→443 跳转；HTTP/2 下
#        中文页几十个字体分片不再在 HTTP/1.1 下排队下载，首访加载显著提速）
#   4. 把 server 内 X-Forwarded-Proto 由 $scheme 改回固定 https（原因见该行注释），reload
#   5. 若启用 Cloudflare 橙云代理：SSL/TLS 模式由 Flexible 升为 Full (strict)
#   6. 收尾：安全组关掉 8080；后台「站点设置」填 ICP 备案号（页脚自动
#      渲染并链接 beian.miit.gov.cn）；上线 30 天内到 beian.gov.cn 办公安备案
#   后续可选：静态资源接阿里云 CDN / OSS，解除小带宽瓶颈。
#
# ─────────────────────────────────────────────────────────────────────────────
# 性能说明（2CPU/2GB 小服务器 + 1-5Mbps 小带宽的针对性优化）：
#   1. gzip 由 nginx 接管（next.config.ts 已设 compress: false，Node 不再逐响应压缩）
#   2. /_next/static 与 public 静态目录（live2d/music/assets/uploads）nginx 直发磁盘，
#      绕过 Node 进程，并带长缓存（构建产物文件名含内容 hash，uploads 文件名含
#      时间戳+随机 hex，均可 immutable）
#   3. /_next/image 的 sharp 实时优化结果落盘缓存 30 天——远程图床转码不再吃 CPU
#   4. 页面 HTML 30 秒微缓存（按 locale cookie 分变体）。全站是 force-dynamic
#      （根布局读 locale cookie，见 src/lib/i18n/server.ts），每个请求都会完整 SSR，
#      微缓存让匿名流量的 TTFB 从数百毫秒降到 <20ms。安全阀：
#        - 带 RSC 头的请求（站内导航）bypass——返回的是 flight 数据不是 HTML 文档
#        - 带 cl_admin cookie（管理登录态）bypass——绝不串登录态
#        - 响应含 Set-Cookie 的不落缓存
#        - /api、/admin、/api/chat 各自独立 location，不吃页面缓存
#   5. 删除了全局 proxy_buffering off 与 WebSocket upgrade 头：/api/chat 的 SSE
#      已由响应头 X-Accel-Buffering: no 逐请求禁缓冲（且下方有显式 location 双保险），
#      生产无 WebSocket；upstream keepalive 复用连接降低 Node 开销
# ─────────────────────────────────────────────────────────────────────────────

# ---- http 级指令（本文件被 include 进 http 块，必须位于 server 之外）----

# /_next/image 优化结果的磁盘缓存
proxy_cache_path /var/cache/nginx/img levels=1:2 keys_zone=nextimg:20m
                 max_size=1g inactive=60d use_temp_path=off;

# 页面 HTML 微缓存
proxy_cache_path /var/cache/nginx/html levels=1:2 keys_zone=html:20m
                 max_size=200m inactive=10m use_temp_path=off;

upstream nextjs {
    server 127.0.0.1:3002;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    server_name chunlongblog.cn www.chunlongblog.cn;

    client_max_body_size 20m;

    # gzip 压缩文本资源（woff2/png/wav/moc 等已是压缩格式，不列入）
    # text/html 无需列出，gzip 总是生效
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml image/svg+xml text/x-component;

    # ---- 反代通用头（server 级声明，被下方所有 proxy location 继承；
    #      注意：任何 location 内一旦再写 proxy_set_header 会整体覆盖继承）----
    proxy_http_version 1.1;
    # keepalive 复用要求清空 Connection 头（生产无 WebSocket，无需 upgrade）
    proxy_set_header Connection "";

    # 必须用 $http_host（原始 Host 头，含端口），不能用 $host（非标准端口时会
    # 剥掉端口）：Next.js 校验 server action 的 Origin 头与 Host 头必须严格一致，
    # 端口被剥会被判为 CSRF 而拒绝（登录等所有表单提交一律 500
    # "Invalid Server Actions request"。备案期 IP:8080 直连时踩过，保留写法一劳永逸）
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 登录 cookie 的 Secure 属性依据此头判断（见 src/lib/auth.ts）：
    # certbot 签完证书、80→443 跳转生效后，改回固定值：
    #   proxy_set_header X-Forwarded-Proto https;
    # （访客全程 HTTPS 或 Cloudflare 以 HTTPS 回源，固定 https 避免应用生成
    #   http:// 链接；而证书就绪前的纯 HTTP 直连下发 Secure cookie 会导致无法登录，
    #   所以切序必须是先 certbot、后固定 https）
    proxy_set_header X-Forwarded-Proto $scheme;

    # ---- 静态资源：nginx 直发磁盘，绕过 Node ----

    # Next 构建产物（JS/CSS/字体分片，文件名带内容 hash，可永久缓存）
    location ^~ /_next/static/ {
        alias /opt/chunlong-blog/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # public/ 静态目录（rsync 每次部署同步，/public/uploads/ 是服务器端持久目录）
    location ^~ /live2d/ {
        alias /opt/chunlong-blog/public/live2d/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /music/ {
        alias /opt/chunlong-blog/public/music/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
    location ^~ /assets/ {
        alias /opt/chunlong-blog/public/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }
    # 上传文件名含时间戳+随机 hex（api/upload/route.ts），内容不变，可 immutable
    location ^~ /uploads/ {
        alias /opt/chunlong-blog/public/uploads/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- next/image 优化结果缓存（远程图床的 sharp 转码是 2 核 CPU 大户）----
    location ^~ /_next/image {
        proxy_pass http://nextjs;
        proxy_cache nextimg;
        proxy_cache_key "$scheme|$host|$request_uri";
        # 尊重上游 Vary: Accept（webp/avif 按浏览器能力分变体，nginx 默认处理）
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10m;
        # 注：http_5xx 通配需 nginx 1.21+，Ubuntu 22.04 自带 1.18 只认具体状态码
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # 同图并发回源只放一个，其余等结果
        proxy_cache_lock on;
        access_log off;
        add_header X-Image-Cache $upstream_cache_status;
    }

    # ---- API：一律不缓存 ----

    # AI 小助手 SSE 流：必须禁缓冲，否则打字机效果会被 nginx 攒成一坨再吐出
    # （应用侧已发 X-Accel-Buffering: no，这里显式声明双保险）
    location ^~ /api/chat {
        proxy_pass http://nextjs;
        proxy_buffering off;
    }
    location ^~ /api/ {
        proxy_pass http://nextjs;
    }

    # ---- 管理后台：一律不缓存 ----
    location ^~ /admin {
        proxy_pass http://nextjs;
    }

    # ---- 页面：30 秒 HTML 微缓存 ----
    location / {
        proxy_pass http://nextjs;

        proxy_cache html;
        # 按 locale cookie 分变体（cl-locale: zh/en/ja/ko）
        proxy_cache_key "$scheme|$host|$request_uri|$cookie_cl_locale";
        proxy_cache_valid 200 30s;
        proxy_cache_valid 404 10s;
        # force-dynamic 页面默认 no-store，必须忽略才能缓存
        proxy_ignore_headers Cache-Control Expires;
        # 安全阀：RSC 头（站内导航，响应是 flight 数据）与
        # cl_admin cookie（管理登录态）绝不读写缓存
        proxy_cache_bypass $http_rsc $cookie_cl_admin;
        proxy_no_cache $http_rsc $cookie_cl_admin $upstream_http_set_cookie;
        # 源站故障/刷新时允许先吐旧页（具体状态码写法，兼容 nginx 1.18）
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        # 突发并发同一页面只回源一个
        proxy_cache_lock on;
        add_header X-Html-Cache $upstream_cache_status;
    }
}
