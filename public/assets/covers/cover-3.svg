<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="160"/>
    </filter>
    <radialGradient id="g0">
      <stop offset="0%" stop-color="#c2e9fb"/>
      <stop offset="100%" stop-color="#c2e9fb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1">
      <stop offset="0%" stop-color="#a18cd1"/>
      <stop offset="100%" stop-color="#a18cd1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#base)"/>
  <circle cx="600" cy="320" r="340" fill="url(#g0)" filter="url(#blur)" opacity="0.85"/>
  <circle cx="1100" cy="520" r="260" fill="url(#g1)" filter="url(#blur)" opacity="0.85"/>
  <text x="60" y="560" font-family="'Segoe UI', 'Noto Sans SC', sans-serif" font-size="64" font-weight="800" fill="rgba(255,255,255,.85)">SQLite</text>
</svg>
