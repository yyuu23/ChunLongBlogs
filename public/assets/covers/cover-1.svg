    <radialGradient id="g0">
      <stop offset="0%" stop-color="#fbc2eb"/>
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g1">
      <stop offset="0%" stop-color="#a1c4fd"/>
